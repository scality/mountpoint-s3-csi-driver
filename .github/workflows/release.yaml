name: Release
run-name: Release ${{ inputs.tag }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to be released (e.g., 1.0.0)"
        required: true
      all_platforms:
        description: "Build Docker for all platforms (linux/amd64,linux/arm64) or just linux/amd64"
        required: false
        type: boolean
        default: true

jobs:
  # Always publish documentation for every release
  publish-versioned-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The build is portable: the same files work under <major.minor>/
      # and under the latest symlink.
      - name: Build the documentation site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Extract major.minor version
        id: version
        run: |
          # Extract major.minor from tag (e.g., 1.0.0 -> 1.0, 1.1.1 -> 1.1)
          VERSION=$(echo "${{ inputs.tag }}" | sed -E 's/^([0-9]+\.[0-9]+).*$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing documentation for version: $VERSION (from tag: ${{ inputs.tag }})"

      # Same gh-pages layout as before: one folder per major.minor, a latest
      # symlink, versions.json (read by the older MkDocs versions' selector)
      # and a root redirect to the default version.
      - name: Publish to gh-pages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"

          rm -rf "$VERSION"
          cp -R "$GITHUB_WORKSPACE/website/doc_build" "$VERSION"
          ln -sfn "$VERSION" latest

          python3 - <<'EOF'
          import json, os
          version = os.environ["VERSION"]
          entries = json.load(open("versions.json")) if os.path.exists("versions.json") else []
          entries = [e for e in entries if e["version"] != version]
          for e in entries:
              e["aliases"] = [a for a in e.get("aliases", []) if a != "latest"]
          entries.append({"version": version, "title": version, "aliases": ["latest"]})
          entries.sort(key=lambda e: [int(p) for p in e["version"].split(".")], reverse=True)
          json.dump(entries, open("versions.json", "w"), indent=2)
          EOF

          cat > index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting</title>
            <noscript>
              <meta http-equiv="refresh" content="1; url=$VERSION/" />
            </noscript>
            <script>
              window.location.replace(
                "$VERSION/" + window.location.search + window.location.hash
              );
            </script>
          </head>
          <body>
            Redirecting to <a href="$VERSION/">$VERSION/</a>...
          </body>
          </html>
          EOF

          git add -A
          git commit -m "Deploy ${{ github.sha }} to $VERSION (latest) with rspress"
          git push origin gh-pages

  prod-container-with-docker:
    needs: [publish-versioned-docs]
    permissions:
      contents: read
      packages: write
    uses: scality/workflows/.github/workflows/docker-build.yaml@v2
    with:
      context: .
      name: mountpoint-s3-csi-driver
      namespace: ${{ github.repository_owner }}
      tag: ${{ inputs.tag }}
      platforms: ${{ inputs.all_platforms && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  package-helm-chart:
    needs: [publish-versioned-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.2

      - name: login to ghcr.io with helm
        run: helm registry login -u actions -p ${{ github.token }} ghcr.io

      - name: Package Helm Chart
        run: |
          helm package ./charts/scality-mountpoint-s3-csi-driver --version ${{ inputs.tag }} --app-version ${{ inputs.tag }}

      - name: Upload Helm Chart as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: scality-mountpoint-s3-csi-driver-${{ inputs.tag }}.tgz

      - name: Push helm chart to ghcr.io
        run: helm push scality-mountpoint-s3-csi-driver-${{ inputs.tag }}.tgz oci://ghcr.io/${{ github.repository }}/helm-charts

      - name: Pull the helm chart
        run: helm pull oci://ghcr.io/${{ github.repository }}/helm-charts/scality-mountpoint-s3-csi-driver --version ${{ inputs.tag }}

      - name: Show the helm chart
        run: helm show all oci://ghcr.io/${{ github.repository }}/helm-charts/scality-mountpoint-s3-csi-driver --version ${{ inputs.tag }}

      - name: Template the helm chart
        run: helm template oci://ghcr.io/${{ github.repository }}/helm-charts/scality-mountpoint-s3-csi-driver --version ${{ inputs.tag }}

  create-github-release:
    runs-on: ubuntu-latest
    needs: [prod-container-with-docker, package-helm-chart]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          generate_release_notes: true
          body: |
            ## Scality CSI Driver for S3

            **Documentation**: https://scality.github.io/mountpoint-s3-csi-driver/
