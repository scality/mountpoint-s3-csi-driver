name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dead internal links fail the build (markdown.link.checkDeadLinks).
      - name: Build
        run: npm run build

  # Merges into main refresh the internal portal: OpenSource/mountpoint-s3-csi-driver/main/.
  publish-internal:
    name: Publish to documentation-internal
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs-portal.yaml
    with:
      version: main
      environment: documentation-internal
    secrets: inherit
